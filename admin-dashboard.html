<!DOCTYPE html>
<html>
<head>
  <title>Admin Analytics Dashboard</title>

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- CHART JS -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- JSPDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>

    body{
      font-family:Arial;
      margin:0;
      background:#eef2f7;
      padding:20px;
    }

    .container{
      max-width:1200px;
      margin:auto;
    }

    h1{
      text-align:center;
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
      gap:15px;
    }

    .card{
      background:white;
      padding:20px;
      border-radius:12px;
      box-shadow:0 0 10px rgba(0,0,0,0.1);
      text-align:center;
    }

    canvas{
      max-width:100%;
    }

    .btn{
      padding:10px 15px;
      border:none;
      border-radius:8px;
      background:#007bff;
      color:white;
      cursor:pointer;
      font-weight:bold;
    }

    table{
      width:100%;
      border-collapse:collapse;
      margin-top:15px;
    }

    th,td{
      border:1px solid #ddd;
      padding:10px;
      text-align:center;
    }

    th{
      background:#007bff;
      color:white;
    }

  </style>
</head>

<body>

<div class="container">

  <h1>Admin Analytics Dashboard</h1>

  <!-- STATS -->
  <div class="grid">

    <div class="card">
      <h2 id="totalStudents">0</h2>
      <p>Total Results</p>
    </div>

    <div class="card">
      <h2 id="avgScore">0</h2>
      <p>Average Score</p>
    </div>

    <div class="card">
      <h2 id="topper">-</h2>
      <p>Top Performer</p>
    </div>

  </div>

  <br>

  <!-- PIE CHART -->
  <div class="card">
    <h2>Pass / Fail Ratio</h2>
    <canvas id="pieChart"></canvas>
  </div>

  <br>

  <!-- STUDENT TABLE -->
  <div class="card">
    <h2>Student List</h2>

    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Class</th>
          <th>Score</th>
          <th>Action</th>
        </tr>
      </thead>

      <tbody id="table"></tbody>
    </table>

  </div>

</div>

<script type="module">

import { db } from './firebase-config.js';

import {
  collection,
  getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

let results = [];

/* ================= LOAD DATA ================= */
async function load(){

  const snap = await getDocs(collection(db,"results"));

  let total = 0;
  let sum = 0;
  let pass = 0;
  let fail = 0;

  let topper = {score:0,name:""};

  let tableHTML = "";

  snap.forEach(doc=>{

    let r = doc.data();
    results.push(r);

    total++;
    sum += r.score;

    let percent = (r.score/r.total)*100;

    if(percent >= 40) pass++;
    else fail++;

    if(r.score > topper.score){
      topper = {score:r.score,name:r.studentName};
    }

    tableHTML += `
      <tr>
        <td>${r.studentName}</td>
        <td>${r.studentClass}</td>
        <td>${r.score}/${r.total}</td>
        <td>
          <button class="btn" onclick='downloadCert("${r.studentName}",${r.score},${r.total})'>
            Certificate
          </button>
        </td>
      </tr>
    `;

  });

  document.getElementById("table").innerHTML = tableHTML;

  document.getElementById("totalStudents").innerText = total;

  document.getElementById("avgScore").innerText =
    (sum/total || 0).toFixed(2);

  document.getElementById("topper").innerText =
    topper.name;

  drawChart(pass,fail);
}

/* ================= PIE CHART ================= */
function drawChart(pass,fail){

  new Chart(document.getElementById("pieChart"),{
    type:"pie",
    data:{
      labels:["Pass","Fail"],
      datasets:[{
        data:[pass,fail],
        backgroundColor:["#28a745","#dc3545"]
      }]
    }
  });

}

/* ================= CERTIFICATE ================= */
window.downloadCert = function(name,score,total){

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();

  let percent = Math.round((score/total)*100);

  doc.setFontSize(20);
  doc.text("CERTIFICATE OF ACHIEVEMENT",20,30);

  doc.setFontSize(14);
  doc.text(`This is to certify that`,20,50);

  doc.setFontSize(16);
  doc.text(name,20,65);

  doc.setFontSize(14);
  doc.text(`has scored ${score}/${total} (${percent}%)`,20,80);

  doc.text("Congratulations 🎉",20,100);

  doc.save(name+"_certificate.pdf");
};

load();

</script>

</body>
</html>
