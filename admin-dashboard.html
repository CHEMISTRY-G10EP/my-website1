<!DOCTYPE html>
<html>
<head>
  <title>Modern Admin Dashboard</title>

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>

    body{
      font-family:Arial;
      margin:0;
      background:#f4f6fb;
      padding:20px;
    }

    .container{
      max-width:1200px;
      margin:auto;
    }

    h1{
      text-align:center;
      margin-bottom:20px;
    }

    /* FILTER BAR */
    .filter{
      display:flex;
      justify-content:center;
      gap:10px;
      margin-bottom:20px;
    }

    select{
      padding:10px;
      border-radius:8px;
      border:1px solid #ccc;
    }

    /* STATS */
    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
      gap:12px;
      margin-bottom:15px;
    }

    .card{
      background:white;
      padding:15px;
      border-radius:10px;
      text-align:center;
      box-shadow:0 2px 8px rgba(0,0,0,0.08);
    }

    /* CHART BOX */
    .chartBox{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:15px;
      margin-bottom:20px;
    }

    canvas{
      background:white;
      border-radius:10px;
      padding:10px;
    }

    /* TABLE */
    table{
      width:100%;
      border-collapse:collapse;
      background:white;
      border-radius:10px;
      overflow:hidden;
    }

    th,td{
      padding:10px;
      border:1px solid #eee;
      text-align:center;
    }

    th{
      background:#007bff;
      color:white;
    }

    /* MEDALS */
    .gold{color:gold;font-size:18px;}
    .silver{color:silver;font-size:18px;}
    .bronze{color:#cd7f32;font-size:18px;}

  </style>
</head>

<body>

<div class="container">

  <h1>Admin Analytics Dashboard</h1>

  <!-- FILTER -->
  <div class="filter">
    <select id="classFilter" onchange="loadData()">
      <option value="ALL">All Classes</option>
      <option value="10">Class 10</option>
      <option value="11">Class 11</option>
      <option value="12">Class 12</option>
    </select>
  </div>

  <!-- STATS -->
  <div class="grid">

    <div class="card">
      <h2 id="total">0</h2>
      <p>Total</p>
    </div>

    <div class="card">
      <h2 id="avg">0</h2>
      <p>Avg Score</p>
    </div>

    <div class="card">
      <h2 id="topper">-</h2>
      <p>Topper</p>
    </div>

  </div>

  <!-- CHARTS -->
  <div class="chartBox">

    <canvas id="pieChart"></canvas>
    <canvas id="monthChart"></canvas>

  </div>

  <!-- TABLE -->
  <table>
    <thead>
      <tr>
        <th>Rank</th>
        <th>Name</th>
        <th>Class</th>
        <th>Score</th>
      </tr>
    </thead>
    <tbody id="table"></tbody>
  </table>

</div>

<script type="module">

import { db } from './firebase-config.js';
import { collection, getDocs } from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

let pieChart, monthChart;

window.loadData = async function(){

  const filter = document.getElementById("classFilter").value;

  const snap = await getDocs(collection(db,"results"));

  let list = [];

  snap.forEach(doc=>{
    let r = doc.data();
    if(filter === "ALL" || r.studentClass == filter){
      list.push(r);
    }
  });

  /* SORT RANK */
  list.sort((a,b)=>b.score-a.score);

  let total = list.length;
  let sum = 0;
  let pass = 0;
  let fail = 0;

  let topper = list[0] || {studentName:"-"};

  let tableHTML = "";

  list.forEach((r,i)=>{

    sum += r.score;

    let percent = (r.score/r.total)*100;
    if(percent >= 40) pass++; else fail++;

    let medal = "";
    if(i===0) medal = "🥇";
    else if(i===1) medal = "🥈";
    else if(i===2) medal = "🥉";

    tableHTML += `
      <tr>
        <td>${medal || i+1}</td>
        <td>${r.studentName}</td>
        <td>${r.studentClass}</td>
        <td>${r.score}/${r.total}</td>
      </tr>
    `;
  });

  document.getElementById("table").innerHTML = tableHTML;
  document.getElementById("total").innerText = total;
  document.getElementById("avg").innerText = total ? (sum/total).toFixed(2) : 0;
  document.getElementById("topper").innerText = topper.studentName;

  drawPie(pass,fail);
  drawMonth(list);
};

/* PIE CHART (SMALL MODERN) */
function drawPie(pass,fail){

  if(pieChart) pieChart.destroy();

  pieChart = new Chart(document.getElementById("pieChart"),{
    type:"doughnut",
    data:{
      labels:["Pass","Fail"],
      datasets:[{
        data:[pass,fail],
        backgroundColor:["#28a745","#dc3545"]
      }]
    },
    options:{
      plugins:{legend:{position:"bottom"}}
    }
  });
}

/* MONTHLY CHART */
function drawMonth(list){

  let months = {};

  list.forEach(r=>{
    let d = new Date(r.createdAt);
    let m = d.getMonth();

    months[m] = (months[m]||0)+1;
  });

  if(monthChart) monthChart.destroy();

  monthChart = new Chart(document.getElementById("monthChart"),{
    type:"bar",
    data:{
      labels:Object.keys(months),
      datasets:[{
        label:"Tests Submitted",
        data:Object.values(months),
        backgroundColor:"#007bff"
      }]
    }
  });
}

/* START */
loadData();

</script>

</body>
</html>
