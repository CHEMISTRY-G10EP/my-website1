<!DOCTYPE html>
<html>
<head>
  <title>Admin Dashboard</title>

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>

    body{
      font-family:Arial;
      margin:0;
      background:#f4f6fb;
      padding:20px;
    }

    .container{
      max-width:1100px;
      margin:auto;
    }

    h1{
      text-align:center;
      margin-bottom:15px;
    }

    /* FILTER */
    .filter{
      text-align:center;
      margin-bottom:15px;
    }

    select{
      padding:10px;
      border-radius:8px;
      border:1px solid #ccc;
    }

    /* STATS */
    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
      gap:10px;
      margin-bottom:15px;
    }

    .card{
      background:white;
      padding:15px;
      border-radius:10px;
      text-align:center;
      box-shadow:0 2px 6px rgba(0,0,0,0.08);
    }

    /* SMALL CHART AREA */
    .chartBox{
      display:flex;
      justify-content:center;
      margin-bottom:15px;
    }

    canvas{
      max-width:220px !important;
      max-height:220px !important;
      background:white;
      padding:10px;
      border-radius:10px;
    }

    table{
      width:100%;
      border-collapse:collapse;
      background:white;
      border-radius:10px;
      overflow:hidden;
    }

    th,td{
      padding:10px;
      text-align:center;
      border:1px solid #eee;
    }

    th{
      background:#007bff;
      color:white;
    }

  </style>
</head>

<body>

<div class="container">

  <h1>Admin Dashboard</h1>

  <!-- CLASS FILTER -->
  <div class="filter">
    <select id="classFilter" onchange="loadData()">
      <option value="ALL">All Classes</option>
      <option value="10">Class 10</option>
      <option value="11">Class 11</option>
      <option value="12">Class 12</option>
    </select>
  </div>

  <!-- STATS -->
  <div class="grid">
    <div class="card">
      <h2 id="total">0</h2>
      <p>Total</p>
    </div>

    <div class="card">
      <h2 id="avg">0</h2>
      <p>Average</p>
    </div>

    <div class="card">
      <h2 id="topper">-</h2>
      <p>Topper</p>
    </div>
  </div>

  <!-- SMALL PIE -->
  <div class="chartBox">
    <canvas id="pieChart"></canvas>
  </div>

  <!-- TABLE -->
  <table>
    <thead>
      <tr>
        <th>Rank</th>
        <th>Name</th>
        <th>Class</th>
        <th>Score</th>
      </tr>
    </thead>
    <tbody id="table"></tbody>
  </table>

</div>

<script type="module">

import { db } from './firebase-config.js';
import { collection, getDocs } from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

let chart;

window.loadData = async function(){

  const filter = document.getElementById("classFilter").value;

  const snap = await getDocs(collection(db,"results"));

  let list = [];

  snap.forEach(doc=>{
    let r = doc.data();

    if(filter === "ALL" || r.studentClass == filter){
      list.push(r);
    }
  });

  if(list.length === 0){
    document.getElementById("table").innerHTML =
      "<tr><td colspan='4'>No Data</td></tr>";
    return;
  }

  list.sort((a,b)=>b.score-a.score);

  let total = list.length;
  let sum = 0;
  let pass = 0;
  let fail = 0;

  let topper = list[0];

  let html = "";

  list.forEach((r,i)=>{

    sum += r.score;

    let percent = (r.score/r.total)*100;

    if(percent >= 40) pass++;
    else fail++;

    if(r.score > topper.score){
      topper = r;
    }

    let medal = i===0?"🥇":i===1?"🥈":i===2?"🥉":"";

    html += `
      <tr>
        <td>${medal || i+1}</td>
        <td>${r.studentName}</td>
        <td>${r.studentClass}</td>
        <td>${r.score}/${r.total}</td>
      </tr>
    `;
  });

  document.getElementById("table").innerHTML = html;

  document.getElementById("total").innerText = total;
  document.getElementById("avg").innerText = (sum/total).toFixed(2);
  document.getElementById("topper").innerText = topper.studentName;

  drawPie(pass,fail);
};

/* SMALL MODERN PIE */
function drawPie(pass,fail){

  if(chart) chart.destroy();

  chart = new Chart(document.getElementById("pieChart"),{
    type:"doughnut",
    data:{
      labels:["Pass","Fail"],
      datasets:[{
        data:[pass,fail],
        backgroundColor:["#28a745","#dc3545"],
        borderWidth:1
      }]
    },
    options:{
      plugins:{
        legend:{
          position:"bottom"
        }
      }
    }
  });
}

/* LOAD ON START */
loadData();

</script>

</body>
</html>
