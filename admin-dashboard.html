<!DOCTYPE html>
<html>
<head>
  <title>Admin Dashboard (Fixed)</title>

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>

    body{
      font-family:Arial;
      margin:0;
      background:#f4f6fb;
      padding:20px;
    }

    .container{
      max-width:1100px;
      margin:auto;
    }

    h1{text-align:center;}

    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
      gap:10px;
      margin-bottom:15px;
    }

    .card{
      background:white;
      padding:15px;
      border-radius:10px;
      text-align:center;
      box-shadow:0 2px 6px rgba(0,0,0,0.1);
    }

    .charts{
      display:grid;
      grid-template-columns:1fr;
      gap:15px;
      margin-bottom:15px;
    }

    canvas{
      background:white;
      border-radius:10px;
      padding:10px;
    }

    table{
      width:100%;
      border-collapse:collapse;
      background:white;
      border-radius:10px;
      overflow:hidden;
    }

    th,td{
      padding:10px;
      border:1px solid #eee;
      text-align:center;
    }

    th{
      background:#007bff;
      color:white;
    }

    .empty{
      text-align:center;
      background:white;
      padding:20px;
      border-radius:10px;
    }

  </style>
</head>

<body>

<div class="container">

  <h1>Admin Dashboard</h1>

  <div class="grid">

    <div class="card">
      <h2 id="total">0</h2>
      <p>Total</p>
    </div>

    <div class="card">
      <h2 id="avg">0</h2>
      <p>Average</p>
    </div>

    <div class="card">
      <h2 id="topper">-</h2>
      <p>Topper</p>
    </div>

  </div>

  <div class="charts">
    <canvas id="pie"></canvas>
  </div>

  <div id="tableWrap"></div>

</div>

<script type="module">

import { db } from './firebase-config.js';
import { collection, getDocs } from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

let pie;

function safeDate(d){
  let date = new Date(d);
  return isNaN(date.getTime()) ? Date.now() : date;
}

async function load(){

  const snap = await getDocs(collection(db,"results"));

  let list = [];

  snap.forEach(doc=>{
    list.push(doc.data());
  });

  if(list.length === 0){
    document.getElementById("tableWrap").innerHTML =
      `<div class="empty">No Data Found</div>`;
    return;
  }

  let total = list.length;
  let sum = 0;
  let pass = 0;
  let fail = 0;

  let topper = list[0];

  let html = `
    <table>
      <tr>
        <th>Rank</th>
        <th>Name</th>
        <th>Class</th>
        <th>Score</th>
      </tr>
  `;

  list.sort((a,b)=>b.score-a.score);

  list.forEach((r,i)=>{

    sum += r.score;

    let percent = (r.score/r.total)*100;

    if(percent >= 40) pass++;
    else fail++;

    if(r.score > topper.score){
      topper = r;
    }

    let medal = i===0?"🥇":i===1?"🥈":i===2?"🥉":"";

    html += `
      <tr>
        <td>${medal || i+1}</td>
        <td>${r.studentName}</td>
        <td>${r.studentClass}</td>
        <td>${r.score}/${r.total}</td>
      </tr>
    `;
  });

  html += `</table>`;

  document.getElementById("tableWrap").innerHTML = html;

  document.getElementById("total").innerText = total;
  document.getElementById("avg").innerText = (sum/total).toFixed(2);
  document.getElementById("topper").innerText = topper.studentName || "-";

  drawPie(pass,fail);
}

function drawPie(pass,fail){

  if(pie) pie.destroy();

  pie = new Chart(document.getElementById("pie"),{
    type:"doughnut",
    data:{
      labels:["Pass","Fail"],
      datasets:[{
        data:[pass,fail],
        backgroundColor:["#28a745","#dc3545"]
      }]
    },
    options:{
      plugins:{
        legend:{position:"bottom"}
      }
    }
  });
}

load();

</script>

</body>
</html>
