<!DOCTYPE html>
<html>
<head>
  <title>Student Dashboard</title>

  <style>
    body{
      font-family:Arial;
      background:#eef2f7;
      padding:20px;
      margin:0;
    }

    .container{
      max-width:1000px;
      margin:auto;
    }

    .topbar{
      background:white;
      padding:20px;
      border-radius:15px;
      box-shadow:0 0 10px rgba(0,0,0,0.1);
      display:flex;
      justify-content:space-between;
      align-items:center;
      flex-wrap:wrap;
      margin-bottom:25px;
    }

    .student-info h2{
      margin:0;
      color:#333;
    }

    .student-info p{
      margin:5px 0;
      color:#666;
    }

    .btn{
      border:none;
      padding:12px 18px;
      border-radius:8px;
      cursor:pointer;
      font-size:15px;
      font-weight:bold;
      margin:5px;
      transition:0.3s;
    }

    .load-btn{
      background:#007bff;
      color:white;
    }

    .load-btn:hover{
      background:#0056b3;
      transform:scale(1.03);
    }

    .result-btn{
      background:#28a745;
      color:white;
    }

    .result-btn:hover{
      background:#1e7e34;
      transform:scale(1.03);
    }

    .logout-btn{
      background:#dc3545;
      color:white;
    }

    .logout-btn:hover{
      background:#b52a37;
      transform:scale(1.03);
    }

    .test-card{
      background:white;
      padding:20px;
      margin-bottom:20px;
      border-radius:12px;
      box-shadow:0 0 8px rgba(0,0,0,0.08);
    }

    .class-badge{
      display:inline-block;
      background:#17a2b8;
      color:white;
      padding:5px 10px;
      border-radius:20px;
      font-size:13px;
      margin-bottom:10px;
    }

    .start-btn{
      background:#6f42c1;
      color:white;
      border:none;
      padding:10px 15px;
      border-radius:8px;
      cursor:pointer;
    }

    .start-btn:hover{
      background:#59359c;
      transform:scale(1.03);
    }

    #testBox{
      margin-top:20px;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="topbar">

    <div class="student-info">
      <h2>Student Dashboard</h2>
      <p id="userInfo">Loading student info...</p>
    </div>

    <div>
      <button class="btn result-btn" onclick="goResults()">
        Previous Results
      </button>

      <button class="btn logout-btn" onclick="logout()">
        Logout
      </button>
    </div>

  </div>

  <button class="btn load-btn" onclick="loadTest()">
    Load Monthly Test
  </button>

  <div id="testBox"></div>

</div>

<script type="module">

import { db, auth } from './firebase-config.js';

import {
  collection,
  query,
  where,
  getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
  signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

let studentData = null;

/* =======================
   LOAD STUDENT PROFILE
======================= */
auth.onAuthStateChanged(async(user)=>{

  if(!user){
    alert("Login required");
    window.location.href = "index.html";
    return;
  }

  const q = query(
    collection(db, "students"),
    where("email", "==", user.email)
  );

  const snapshot = await getDocs(q);

  if(snapshot.empty){
    document.getElementById("userInfo").innerHTML =
      "Student profile not found";
    return;
  }

  studentData = snapshot.docs[0].data();

  document.getElementById("userInfo").innerHTML = `
    <b>Name:</b> ${studentData.name}<br>
    <b>Class:</b> ${studentData.class}<br>
    <b>Email:</b> ${studentData.email}
  `;
});


/* =======================
   LOAD CLASS TESTS
======================= */
window.loadTest = async function () {

  if(!studentData){
    alert("Student data not loaded yet");
    return;
  }

  const querySnapshot = await getDocs(collection(db, "tests"));

  let html = "<h2>Available Tests</h2>";
  let found = false;

  querySnapshot.forEach((doc)=>{

    let t = doc.data();

    // SAFE CLASS CHECK
    if(String(t.className) !== String(studentData.class)) return;

    found = true;

    html += `
      <div class="test-card">

        <div class="class-badge">
          Class ${t.className}
        </div>

        <h3>${t.title}</h3>

        <button class="start-btn" onclick="startTest('${doc.id}')">
          Start Test
        </button>

      </div>
    `;
  });

  if(!found){
    html += `<p>No tests available for your class.</p>`;
  }

  document.getElementById("testBox").innerHTML = html;
};


/* =======================
   START TEST
======================= */
window.startTest = function(testId){
  localStorage.setItem("testId", testId);
  window.location.href = "test.html";
};


/* =======================
   GO RESULTS
======================= */
window.goResults = function(){
  window.location.href = "results.html";
};


/* =======================
   LOGOUT
======================= */
window.logout = async function(){
  await signOut(auth);
  alert("Logged out successfully");
  window.location.href = "index.html";
};

</script>

</body>
</html>
