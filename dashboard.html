<!DOCTYPE html>
<html>
<head>
  <title>Student Dashboard</title>

  <style>
    body{
      font-family:Arial;
      background:#eef2f7;
      padding:20px;
      margin:0;
    }

    .container{
      max-width:1000px;
      margin:auto;
    }

    .topbar{
      background:white;
      padding:20px;
      border-radius:15px;
      box-shadow:0 0 10px rgba(0,0,0,0.1);
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:25px;
    }

    .btn{
      border:none;
      padding:12px 18px;
      border-radius:8px;
      cursor:pointer;
      font-weight:bold;
      margin:5px;
    }

    .load-btn{ background:#007bff; color:white; }
    .result-btn{ background:#28a745; color:white; }
    .logout-btn{ background:#dc3545; color:white; }

    .test-card{
      background:white;
      padding:20px;
      margin-bottom:15px;
      border-radius:12px;
      box-shadow:0 0 8px rgba(0,0,0,0.08);
    }

    .class-badge{
      display:inline-block;
      background:#17a2b8;
      color:white;
      padding:5px 10px;
      border-radius:20px;
      font-size:13px;
    }

    .start-btn{
      background:#6f42c1;
      color:white;
      padding:10px 15px;
      border:none;
      border-radius:8px;
      cursor:pointer;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="topbar">
    <div>
      <h2>Student Dashboard</h2>
      <p id="userInfo">Loading student info...</p>
    </div>

    <div>
      <button class="btn result-btn" onclick="goResults()">Previous Results</button>
      <button class="btn logout-btn" onclick="logout()">Logout</button>
    </div>
  </div>

  <button class="btn load-btn" onclick="loadTest()">Load Monthly Test</button>

  <div id="testBox"></div>

</div>

<script type="module">

import { db, auth } from './firebase-config.js';

import {
  collection,
  query,
  where,
  getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
  signOut,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

let studentData = null;

/* =======================
   LOAD STUDENT PROFILE
======================= */
onAuthStateChanged(auth, async (user) => {

  if (!user) {
    window.location.href = "index.html";
    return;
  }

  const q = query(
    collection(db, "students"),
    where("email", "==", user.email)
  );

  const snapshot = await getDocs(q);

  if (snapshot.empty) {
    document.getElementById("userInfo").innerHTML =
      "Student profile not found";
    return;
  }

  studentData = snapshot.docs[0].data();

  document.getElementById("userInfo").innerHTML = `
    <b>Name:</b> ${studentData.name}<br>
    <b>Class:</b> ${studentData.class}<br>
    <b>Email:</b> ${studentData.email}
  `;
});


/* =======================
   LOAD TESTS (FIXED)
======================= */
window.loadTest = async function () {

  if (!studentData) {
    alert("Please wait, loading student data...");
    return;
  }

  const snapshot = await getDocs(collection(db, "tests"));

  let html = "<h3>Available Tests</h3>";
  let found = false;

  snapshot.forEach((docSnap) => {

    const t = docSnap.data();

    // IMPORTANT FIX: convert both to string
    if (String(t.className) !== String(studentData.class)) return;

    found = true;

    html += `
      <div class="test-card">
        <div class="class-badge">Class ${t.className}</div>
        <h3>${t.title}</h3>
        <button class="start-btn" onclick="startTest('${docSnap.id}')">
          Start Test
        </button>
      </div>
    `;
  });

  if (!found) {
    html = "<p>No tests available for your class.</p>";
  }

  document.getElementById("testBox").innerHTML = html;
};


/* =======================
   START TEST
======================= */
window.startTest = function(testId){
  localStorage.setItem("testId", testId);
  window.location.href = "test.html";
};


/* =======================
   RESULTS PAGE
======================= */
window.goResults = function(){
  window.location.href = "results.html";
};


/* =======================
   LOGOUT
======================= */
window.logout = async function(){
  await signOut(auth);
  window.location.href = "index.html";
};

</script>

</body>
</html>
