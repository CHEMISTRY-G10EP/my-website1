<!DOCTYPE html>
<html>
<head>
  <title>My Results</title>

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>

    *{box-sizing:border-box;}

    body{
      font-family:Arial;
      background:#eef2f7;
      margin:0;
      padding:20px;
    }

    .container{
      max-width:1100px;
      margin:auto;
    }

    .topbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      flex-wrap:wrap;
      margin-bottom:20px;
    }

    h1{
      margin:0;
    }

    .btn{
      background:#007bff;
      color:white;
      border:none;
      padding:12px 18px;
      border-radius:8px;
      cursor:pointer;
      font-weight:bold;
      transition:0.2s;
    }

    .btn:hover{
      transform:scale(1.05);
    }

    /* RESULT CARD */
    .result-card{
      background:white;
      padding:20px;
      border-radius:15px;
      margin-bottom:20px;
      box-shadow:0 0 10px rgba(0,0,0,0.08);
    }

    .badge{
      padding:6px 12px;
      border-radius:20px;
      color:white;
      font-weight:bold;
      display:inline-block;
    }

    .excellent{background:#28a745;}
    .good{background:#17a2b8;}
    .average{background:#ffc107;color:black;}
    .poor{background:#dc3545;}

    .stats{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
      gap:10px;
      margin-top:15px;
    }

    .box{
      padding:12px;
      border-radius:10px;
      color:white;
      text-align:center;
      font-weight:bold;
    }

    .score{background:#007bff;}
    .correct{background:#28a745;}
    .wrong{background:#dc3545;}
    .percent{background:#6f42c1;}

    details{
      margin-top:15px;
    }

    summary{
      cursor:pointer;
      padding:10px;
      background:#f1f1f1;
      border-radius:8px;
      font-weight:bold;
    }

    .qbox{
      background:#fafafa;
      border:1px solid #ddd;
      padding:12px;
      border-radius:10px;
      margin-top:10px;
    }

    .right{color:#28a745;font-weight:bold;}
    .wronga{color:#dc3545;font-weight:bold;}

    .empty{
      text-align:center;
      background:white;
      padding:30px;
      border-radius:15px;
    }

  </style>
</head>

<body>

<div class="container">

  <div class="topbar">
    <h1>My Results</h1>

    <button class="btn" onclick="goDashboard()">
      Back to Dashboard
    </button>
  </div>

  <div id="results">Loading...</div>

</div>

<script type="module">

import { db, auth } from './firebase-config.js';

import {
  collection,
  getDocs,
  query,
  orderBy
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

/* ================= AUTH ================= */
onAuthStateChanged(auth, async(user)=>{

  if(!user){
    window.location.href="index.html";
    return;
  }

  /* ================= FETCH RESULTS ================= */
  const q = query(
    collection(db,"results"),
    orderBy("createdAt","desc")
  );

  const snap = await getDocs(q);

  let html = "";

  snap.forEach(doc=>{

    let r = doc.data();

    if(r.userEmail !== user.email) return;

    let percent = Math.round((r.score/r.total)*100);
    let wrong = r.total - r.score;

    let badgeClass = "poor";
    let text = "Needs Improvement";

    if(percent >= 80){
      badgeClass = "excellent";
      text = "Excellent";
    } else if(percent >= 60){
      badgeClass = "good";
      text = "Good";
    } else if(percent >= 40){
      badgeClass = "average";
      text = "Average";
    }

    html += `
      <div class="result-card">

        <h2>${r.testTitle}</h2>

        <p><b>Date:</b> ${new Date(r.createdAt).toLocaleString()}</p>

        <span class="badge ${badgeClass}">
          ${text}
        </span>

        <div class="stats">

          <div class="box score">
            Score<br>${r.score}/${r.total}
          </div>

          <div class="box correct">
            Correct<br>${r.score}
          </div>

          <div class="box wrong">
            Wrong<br>${wrong}
          </div>

          <div class="box percent">
            Percentage<br>${percent}%
          </div>

        </div>

        <details>

          <summary>View Questions</summary>

          ${
            (r.review || []).map((q,i)=>{

              let ok = q.studentAnswer === q.correctAnswer;

              return `
                <div class="qbox">

                  <h3>Q${i+1}. ${q.question}</h3>

                  <p class="${ok?'right':'wronga'}">
                    Your Answer: ${q.studentAnswer}
                  </p>

                  <p><b>Correct:</b> ${q.correctAnswer}</p>

                  <p>${q.solution || ""}</p>

                </div>
              `;
            }).join("")
          }

        </details>

      </div>
    `;
  });

  if(html === ""){
    html = `
      <div class="empty">
        <h2>No Results Found</h2>
        <p>Attempt a test first</p>
      </div>
    `;
  }

  document.getElementById("results").innerHTML = html;

});

/* ================= NAV ================= */
function goDashboard(){
  window.location.href="dashboard.html";
}

</script>

</body>
</html>
