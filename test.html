<!DOCTYPE html>
<html>
<head>
  <title>Test Page</title>

  <style>

    body{
      font-family:Arial;
      background:#f4f4f4;
      padding:20px;
    }

    .question-box{
      background:white;
      padding:15px;
      margin-bottom:20px;
      border-radius:8px;
      box-shadow:0 0 5px rgba(0,0,0,0.1);
    }

    h2{
      margin-bottom:20px;
    }

    label{
      display:block;
      margin:8px 0;
    }

    button{
      padding:12px 20px;
      cursor:pointer;
      font-size:16px;
    }

  </style>
</head>
<body>

<h2 id="testTitle">Loading Test...</h2>

<div id="questions"></div>

<button onclick="submitTest()">
  Submit Test
</button>

<script type="module">

import { db, auth } from './firebase-config.js';

import {
  doc,
  getDoc,
  addDoc,
  collection
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

let testData;

let answers = {};

onAuthStateChanged(auth, (user)=>{

  if(!user){

    alert("Login required");

    window.location.href = "index.html";

    return;
  }

  loadTest();
});

async function loadTest() {

  let testId =
    localStorage.getItem("testId");

  if(!testId){

    alert("No test selected");

    window.location.href = "dashboard.html";

    return;
  }

  const docRef =
    doc(db, "tests", testId);

  const docSnap =
    await getDoc(docRef);

  if(!docSnap.exists()){

    alert("Test not found");

    return;
  }

  testData = docSnap.data();

  document.getElementById("testTitle").innerText =
    testData.title;

  let html = "";

  testData.questions.forEach((q, index) => {

    html += `
      <div class="question-box">

        <h3>
          ${index + 1}. ${q.question}
        </h3>

        ${
          q.options.map((opt) => `

            <label>

              <input
                type="radio"
                name="q${index}"
                value="${opt}"
                onchange="saveAnswer(${index}, '${opt}')"
              >

              ${opt}

            </label>

          `).join("")
        }

      </div>
    `;
  });

  document.getElementById("questions").innerHTML = html;
}

window.saveAnswer = function(qIndex, value){

  answers[qIndex] = value;
};

window.submitTest = async function(){

  let correct = 0;

  let review = [];

  testData.questions.forEach((q, i) => {

    let studentAnswer =
      answers[i] || "Not Answered";

    if(studentAnswer === q.answer){

      correct++;
    }

    review.push({

      question: q.question,

      studentAnswer: studentAnswer,

      correctAnswer: q.answer,

      solution:
        q.solution || "No solution provided"

    });
  });

  let result = {

    testId:
      localStorage.getItem("testId"),

    testTitle:
      testData.title,

    score: correct,

    total:
      testData.questions.length,

    answers: answers,

    review: review,

    createdAt:
      new Date().toISOString(),

    userEmail:
      auth.currentUser?.email || "Unknown"
  };

  await addDoc(
    collection(db, "results"),
    result
  );

  localStorage.setItem(
    "latestResult",
    JSON.stringify(result)
  );

  window.location.href = "result.html";
};

</script>

</body>
</html>
