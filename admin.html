<!DOCTYPE html>
<html>
<head>
  <title>Admin Panel</title>

  <style>

    body{
      font-family:Arial;
      padding:30px;
      background:#eef2f7;
      margin:0;
    }

    .container{
      max-width:900px;
      margin:auto;
      background:white;
      padding:30px;
      border-radius:15px;
      box-shadow:0 0 15px rgba(0,0,0,0.1);
    }

    h2{
      text-align:center;
      color:#333;
      margin-bottom:25px;
    }

    input, textarea, select{

      width:100%;
      padding:12px;
      margin-bottom:18px;
      border:1px solid #ccc;
      border-radius:8px;
      font-size:15px;
      box-sizing:border-box;
    }

    textarea{
      resize:vertical;
    }

    .btn{

      border:none;
      padding:12px 20px;
      border-radius:8px;
      cursor:pointer;
      font-size:16px;
      font-weight:bold;
      transition:0.3s;
      margin-right:10px;
    }

    .create-btn{
      background:#28a745;
      color:white;
    }

    .create-btn:hover{
      background:#218838;
      transform:scale(1.03);
    }

    .dashboard-btn{
      background:#007bff;
      color:white;
    }

    .dashboard-btn:hover{
      background:#0056b3;
      transform:scale(1.03);
    }

    #msg{
      margin-top:20px;
      font-weight:bold;
      text-align:center;
      font-size:16px;
    }

    .note{
      background:#fff3cd;
      padding:15px;
      border-radius:8px;
      margin-bottom:20px;
      color:#856404;
    }

  </style>
</head>
<body>

<div class="container">

  <h2>Admin - Create Test</h2>

  <div class="note">
    Create class-wise tests for students.
  </div>

  <select id="className">

    <option value="">Select Class</option>

    <option value="10">Class 10</option>
    <option value="11">Class 11</option>
    <option value="12">Class 12</option>
    <option value="IIT-JEE">IIT-JEE</option>
    <option value="NEET">NEET</option>

  </select>

  <input
    id="title"
    placeholder="Enter Test Title"
  >

  <textarea
    id="jsonInput"
    rows="18"

placeholder='[
  {
    "question": "What is the chemical formula of water?",
    "options": ["H2O","CO2","O2","NaCl"],
    "answer": "H2O",
    "solution": "Water is made of Hydrogen and Oxygen. Formula is H2O."
  }
]'></textarea>

  <button
    class="btn create-btn"
    onclick="createTest()"
  >
    Create Test
  </button>

  <button
    class="btn dashboard-btn"
    onclick="goDashboard()"
  >
    Dashboard
  </button>

  <p id="msg"></p>

</div>

<script type="module">

import { db, auth } from './firebase-config.js';

import {
  addDoc,
  collection
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

auth.onAuthStateChanged((user)=>{

  if(!user){

    alert("Login required!");

    window.location.href = "index.html";
  }
});

window.createTest = async function () {

  try {

    let className =
      document.getElementById("className").value;

    let title =
      document.getElementById("title").value.trim();

    let jsonText =
      document.getElementById("jsonInput").value.trim();

    if (!className) {
      throw new Error("Please select class");
    }

    if (!title) {
      throw new Error("Title is required");
    }

    if (!jsonText) {
      throw new Error("Questions are required");
    }

    let questions = JSON.parse(jsonText);

    if (!Array.isArray(questions)) {
      throw new Error("Questions must be an array");
    }

    questions.forEach((q, index) => {

      if (!q.question) {
        throw new Error(
          `Question missing at index ${index}`
        );
      }

      if (!q.options ||
          !Array.isArray(q.options)) {

        throw new Error(
          `Options missing at question ${index + 1}`
        );
      }

      if (!q.answer) {

        throw new Error(
          `Answer missing at question ${index + 1}`
        );
      }

      if (!q.solution) {

        q.solution =
          "No solution provided";
      }
    });

    await addDoc(collection(db, "tests"), {

      className,
      title,
      questions,
      createdAt: new Date().toISOString()

    });

    document.getElementById("msg").style.color =
      "green";

    document.getElementById("msg").innerText =
      "Test Created Successfully!";

    document.getElementById("title").value = "";

    document.getElementById("jsonInput").value = "";

    document.getElementById("className").value = "";

  }
  catch (e) {

    document.getElementById("msg").style.color =
      "red";

    document.getElementById("msg").innerText =
      "Error: " + e.message;
  }
};

window.goDashboard = function(){

  window.location.href = "dashboard.html";
};

</script>

</body>
</html>
