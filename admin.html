<!DOCTYPE html>
<html>
<head>
  <title>Admin Panel</title>

  <style>
    body{
      font-family:Arial;
      background:#eef2f7;
      margin:0;
    }

    /* LOGIN */
    #loginScreen{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
    }

    .login-box{
      background:white;
      padding:30px;
      border-radius:15px;
      width:300px;
      text-align:center;
      box-shadow:0 0 15px rgba(0,0,0,0.1);
    }

    .login-box input{
      width:100%;
      padding:12px;
      margin-top:10px;
      border-radius:8px;
      border:1px solid #ccc;
    }

    .login-box button{
      margin-top:15px;
      padding:12px;
      width:100%;
      border:none;
      border-radius:8px;
      background:#007bff;
      color:white;
      font-weight:bold;
      cursor:pointer;
    }

    /* PANEL */
    .container{
      max-width:900px;
      margin:auto;
      background:white;
      padding:30px;
      border-radius:15px;
      box-shadow:0 0 15px rgba(0,0,0,0.1);
      display:none;
    }

    h2{
      text-align:center;
      color:#333;
      margin-bottom:25px;
    }

    input, textarea, select{
      width:100%;
      padding:12px;
      margin-bottom:18px;
      border:1px solid #ccc;
      border-radius:8px;
      font-size:15px;
    }

    textarea{resize:vertical;}

    .btn{
      border:none;
      padding:12px 20px;
      border-radius:8px;
      cursor:pointer;
      font-size:16px;
      font-weight:bold;
    }

    .create-btn{
      background:#28a745;
      color:white;
    }

    .dashboard-btn{
      background:#007bff;
      color:white;
      margin-left:10px;
    }

    .card{
      background:#fff;
      padding:15px;
      margin:10px 0;
      border-radius:10px;
      box-shadow:0 0 5px rgba(0,0,0,0.1);
    }

    details summary{
      cursor:pointer;
      font-weight:bold;
      margin-top:10px;
    }
  </style>
</head>

<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-box">
    <h2>Admin Login</h2>
    <input type="password" id="pass" placeholder="Enter Password">
    <button onclick="checkPass()">Login</button>
    <p id="error" style="color:red;"></p>
  </div>
</div>

<!-- PANEL -->
<div class="container">

  <h2>Admin Panel</h2>

  <select id="className">
    <option value="">Select Class</option>
    <option value="10">Class 10</option>
    <option value="11">Class 11</option>
    <option value="12">Class 12</option>
    <option value="IIT-JEE">IIT-JEE</option>
    <option value="NEET">NEET</option>
  </select>

  <input id="title" placeholder="Test Title">

  <textarea id="jsonInput" rows="10"
placeholder='[
  {
    "question": "What is Avogadro number?",
    "options": ["6.022 \\times 10^{23}", "3.0 \\times 10^8", "9.8", "1.6 \\times 10^{-19}"],
    "answer": "6.022 \\times 10^{23}",
    "solution": "It is number of particles in 1 mole"
  }
]'></textarea>

  <button class="btn create-btn" onclick="createTest()">Create Test</button>
  <button class="btn dashboard-btn" onclick="loadResults()">Load Results</button>

  <p id="msg"></p>

  <hr>

  <h2>Student Results</h2>
  <div id="resultsBox"></div>

</div>

<script type="module">

import { db } from './firebase-config.js';
import {
  addDoc,
  collection,
  getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ================= LOGIN ================= */
window.checkPass = function(){
  let pass = document.getElementById("pass").value;

  if(pass === "7812"){
    document.getElementById("loginScreen").style.display="none";
    document.querySelector(".container").style.display="block";
  } else {
    document.getElementById("error").innerText="Wrong Password!";
  }
};

/* ================= SAFE JSON PARSER ================= */
function safeJSON(text){
  try {
    // FIX BACKSLASH ISSUES (MathJax safe)
    text = text.replace(/\\(?!["\\/bfnrtu])/g, "\\\\");
    return JSON.parse(text);
  } catch(e){
    throw new Error("Invalid JSON format (check \\ in MathJax)");
  }
}

/* ================= CREATE TEST ================= */
window.createTest = async function(){

  try{
    let className = document.getElementById("className").value;
    let title = document.getElementById("title").value;

    let jsonText = document.getElementById("jsonInput").value;
    let questions = safeJSON(jsonText);

    await addDoc(collection(db,"tests"),{
      className,
      title,
      questions,
      createdAt:new Date().toISOString()
    });

    document.getElementById("msg").innerText="Test Created!";
    document.getElementById("msg").style.color="green";

  } catch(e){
    document.getElementById("msg").innerText=e.message;
    document.getElementById("msg").style.color="red";
  }
};

/* ================= LOAD RESULTS ================= */
window.loadResults = async function(){

  let box = document.getElementById("resultsBox");
  box.innerHTML="Loading...";

  const snap = await getDocs(collection(db,"results"));

  box.innerHTML="";

  snap.forEach(doc => {

    let r = doc.data();

    let reviewHTML="";

    if(r.review){

      r.review.forEach((q,i)=>{

        let ok = q.studentAnswer === q.correctAnswer;

        reviewHTML += `
          <div style="
            padding:10px;
            margin-top:8px;
            border-radius:8px;
            background:${ok?'#e7f9ec':'#ffecec'};
            border-left:5px solid ${ok?'green':'red'};
          ">
            <b>Q${i+1}:</b> ${q.question}<br>
            <b>Your:</b> ${q.studentAnswer}<br>
            <b>Correct:</b> ${q.correctAnswer}<br>
            <small>${q.solution}</small>
          </div>
        `;
      });
    }

    box.innerHTML += `
      <div class="card">
        <b>Student:</b> ${r.studentName}<br>
        <b>Class:</b> ${r.studentClass}<br>
        <b>Email:</b> ${r.userEmail}<br>
        <b>Test:</b> ${r.testTitle}<br>
        <b>Score:</b> ${r.score}/${r.total}<br>
        <b>Date:</b> ${r.createdAt}

        <details>
          <summary>View Full Answers</summary>
          ${reviewHTML}
        </details>

      </div>
    `;
  });
};

</script>

</body>
</html>
