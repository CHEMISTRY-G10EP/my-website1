<!DOCTYPE html>
<html>
<head>
  <title>Admin Panel</title>

  <style>
    body{
      font-family:Arial;
      background:#eef2f7;
      margin:0;
    }

    /* LOGIN SCREEN */
    #loginBox{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
    }

    .login-card{
      background:white;
      padding:30px;
      border-radius:12px;
      box-shadow:0 0 15px rgba(0,0,0,0.1);
      text-align:center;
      width:300px;
    }

    input{
      width:100%;
      padding:12px;
      margin-top:10px;
      border-radius:8px;
      border:1px solid #ccc;
    }

    button{
      margin-top:15px;
      padding:12px;
      width:100%;
      border:none;
      border-radius:8px;
      background:#007bff;
      color:white;
      font-weight:bold;
      cursor:pointer;
    }

    button:hover{
      background:#0056b3;
    }

    /* ADMIN PANEL */
    #adminPanel{
      display:none;
      padding:30px;
    }

    .container{
      max-width:900px;
      margin:auto;
      background:white;
      padding:30px;
      border-radius:15px;
      box-shadow:0 0 15px rgba(0,0,0,0.1);
    }

    h2{
      text-align:center;
    }

    textarea,input,select{
      width:100%;
      padding:12px;
      margin:10px 0;
      border-radius:8px;
      border:1px solid #ccc;
    }

    .btn{
      padding:12px;
      border:none;
      border-radius:8px;
      background:#28a745;
      color:white;
      cursor:pointer;
      font-weight:bold;
    }

    .btn:hover{
      transform:scale(1.03);
    }

  </style>
</head>

<body>

<!-- ================= LOGIN ================= -->
<div id="loginBox">
  <div class="login-card">
    <h2>Admin Login</h2>
    <input type="password" id="pass" placeholder="Enter Password">
    <button onclick="checkPass()">Login</button>
    <p id="msg" style="color:red;"></p>
  </div>
</div>

<!-- ================= ADMIN PANEL ================= -->
<div id="adminPanel">

  <div class="container">

    <h2>Admin Panel</h2>

    <select id="className">
      <option value="">Select Class</option>
      <option value="10">Class 10</option>
      <option value="11">Class 11</option>
      <option value="12">Class 12</option>
    </select>

    <input id="title" placeholder="Test Title">

    <textarea id="jsonInput" rows="10"
placeholder='[{"question":"What is H2O?","options":["Water","Oxygen","Hydrogen","Salt"],"answer":"Water","solution":"Water is H2O"}]'></textarea>

    <button class="btn" onclick="createTest()">Create Test</button>

  </div>

</div>

<script type="module">

import { db } from './firebase-config.js';
import { addDoc, collection } from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ================= PASSWORD CHECK ================= */
window.checkPass = function(){

  let pass = document.getElementById("pass").value;

  if(pass === "7812"){
    document.getElementById("loginBox").style.display = "none";
    document.getElementById("adminPanel").style.display = "block";
  }
  else{
    document.getElementById("msg").innerText = "Wrong Password!";
  }
};

/* ================= CREATE TEST ================= */
window.createTest = async function(){

  let className = document.getElementById("className").value;
  let title = document.getElementById("title").value;
  let jsonText = document.getElementById("jsonInput").value;

  if(!className || !title || !jsonText){
    alert("Fill all fields");
    return;
  }

  let questions = JSON.parse(jsonText);

  await addDoc(collection(db,"tests"),{
    className,
    title,
    questions,
    createdAt:new Date().toISOString()
  });

  alert("Test Created!");

  document.getElementById("title").value="";
  document.getElementById("jsonInput").value="";
};

</script>

</body>
</html>
