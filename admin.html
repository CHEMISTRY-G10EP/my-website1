<!DOCTYPE html>
<html>
<head>
<title>Admin Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body{font-family:Arial;background:#eef2f7;margin:0}

/* LOGIN */
#loginScreen{
  height:100vh;display:flex;justify-content:center;align-items:center;
}
.login-box{
  background:white;padding:30px;border-radius:15px;width:300px;text-align:center;
}
.login-box input{
  width:100%;padding:12px;margin-top:10px;border-radius:8px;
}

/* DASHBOARD */
.container{display:none;padding:20px}

.card{
  background:white;padding:15px;margin:10px 0;border-radius:10px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:15px;
}

canvas{
  max-height:250px !important;
}

/* medals */
.gold{color:gold;font-weight:bold}
.silver{color:silver;font-weight:bold}
.bronze{color:#cd7f32;font-weight:bold}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-box">
    <h2>Admin Login</h2>
    <input type="password" id="pass">
    <button onclick="login()">Login</button>
  </div>
</div>

<!-- DASHBOARD -->
<div class="container" id="dash">

<h2>Admin Analytics Dashboard</h2>

<select id="classFilter" onchange="loadAll()">
  <option value="all">All Classes</option>
  <option value="10">Class 10</option>
  <option value="11">Class 11</option>
  <option value="12">Class 12</option>
</select>

<div class="grid">

  <div class="card">
    <h3>Pie Chart</h3>
    <canvas id="pie"></canvas>
  </div>

  <div class="card">
    <h3>Top Students</h3>
    <div id="rank"></div>
  </div>

</div>

<div class="card">
  <h3>All Results</h3>
  <div id="list"></div>
</div>

<div id="detail"></div>

</div>

<script type="module">

import { db } from './firebase-config.js';
import { collection, getDocs } from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* LOGIN */
window.login = function(){
  if(document.getElementById("pass").value === "7812"){
    document.getElementById("loginScreen").style.display="none";
    document.getElementById("dash").style.display="block";
    loadAll();
  }else alert("Wrong password");
};

let allResults=[];

/* LOAD DATA */
window.loadAll = async function(){

  const snap = await getDocs(collection(db,"results"));
  allResults=[];

  snap.forEach(d=>{
    allResults.push(d.data());
  });

  render();
};

/* RENDER */
function render(){

  let cls=document.getElementById("classFilter").value;

  let data = allResults.filter(r=>{
    return cls==="all" || r.studentClass==cls;
  });

  // PIE
  let correct=0,wrong=0;
  data.forEach(r=>{
    correct+=r.score;
    wrong+=(r.total-r.score);
  });

  new Chart(document.getElementById("pie"),{
    type:"pie",
    data:{
      labels:["Correct","Wrong"],
      datasets:[{data:[correct,wrong]}]
    }
  });

  // RANKING
  let ranks={};

  data.forEach(r=>{
    if(!ranks[r.userEmail]) ranks[r.userEmail]=0;
    ranks[r.userEmail]+=r.score;
  });

  let arr=Object.entries(ranks)
    .sort((a,b)=>b[1]-a[1])
    .slice(0,3);

  let medals=["gold","silver","bronze"];
  document.getElementById("rank").innerHTML=
    arr.map((a,i)=>`
      <p class="${medals[i]}">
        ${i+1}. ${a[0]} - ${a[1]}
      </p>
    `).join("");

  // LIST
  document.getElementById("list").innerHTML=
    data.map((r,i)=>`
      <div class="card">
        <b>${r.studentName}</b> (${r.studentClass})<br>
        Score: ${r.score}/${r.total}
        <button onclick='view(${i})'>View</button>
      </div>
    `).join("");
}

/* VIEW DETAIL */
window.view = function(i){

  let r=allResults[i];

  document.getElementById("detail").innerHTML=`
    <div class="card">
      <h3>${r.studentName} Result</h3>

      ${r.review.map((q,idx)=>`
        <div>
          <b>Q${idx+1}: ${q.question}</b><br>
          Your: ${q.studentAnswer}<br>
          Correct: ${q.correctAnswer}<br>
          ${q.solution}
          <hr>
        </div>
      `).join("")}

      <button onclick="downloadCert('${r.studentName}',${r.score})">
        Download Certificate
      </button>
    </div>
  `;
};

/* CERTIFICATE */
window.downloadCert=function(name,score){

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();

  doc.text("Certificate of Achievement",20,20);
  doc.text("Name: "+name,20,40);
  doc.text("Score: "+score,20,60);

  doc.save(name+"_certificate.pdf");
};

</script>

</body>
</html>
