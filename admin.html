<!DOCTYPE html>
<html>
<head>
  <title>Admin Panel</title>

  <style>
    body{
      font-family:Arial;
      padding:30px;
      background:#eef2f7;
      margin:0;
    }

    .container{
      max-width:900px;
      margin:auto;
      background:white;
      padding:30px;
      border-radius:15px;
      box-shadow:0 0 15px rgba(0,0,0,0.1);
    }

    h2{
      text-align:center;
      color:#333;
      margin-bottom:25px;
    }

    input, textarea, select{
      width:100%;
      padding:12px;
      margin-bottom:18px;
      border:1px solid #ccc;
      border-radius:8px;
      font-size:15px;
      box-sizing:border-box;
    }

    textarea{ resize:vertical; }

    .btn{
      border:none;
      padding:12px 20px;
      border-radius:8px;
      cursor:pointer;
      font-size:16px;
      font-weight:bold;
      transition:0.3s;
      margin-right:10px;
    }

    .create-btn{
      background:#28a745;
      color:white;
    }

    .dashboard-btn{
      background:#007bff;
      color:white;
    }

    .btn:hover{
      transform:scale(1.03);
    }

    #msg{
      margin-top:20px;
      font-weight:bold;
      text-align:center;
    }

    .note{
      background:#fff3cd;
      padding:15px;
      border-radius:8px;
      margin-bottom:20px;
      color:#856404;
    }

    .card{
      background:#fff;
      padding:15px;
      margin:10px 0;
      border-radius:10px;
      box-shadow:0 0 5px rgba(0,0,0,0.1);
    }
  </style>
</head>

<body>

<div class="container">

  <h2>Admin Panel</h2>

  <div class="note">
    Create tests and view all student results.
  </div>

  <!-- ================= CREATE TEST ================= -->

  <select id="className">
    <option value="">Select Class</option>
    <option value="10">Class 10</option>
    <option value="11">Class 11</option>
    <option value="12">Class 12</option>
    <option value="IIT-JEE">IIT-JEE</option>
    <option value="NEET">NEET</option>
  </select>

  <input id="title" placeholder="Enter Test Title">

  <textarea id="jsonInput" rows="12"
placeholder='[
  {
    "question": "What is H2O?",
    "options": ["Water","Oxygen","Hydrogen","Salt"],
    "answer": "Water",
    "solution": "H2O is water"
  }
]'></textarea>

  <button class="btn create-btn" onclick="createTest()">Create Test</button>

  <button class="btn dashboard-btn" onclick="goDashboard()">Dashboard</button>

  <p id="msg"></p>

  <hr>

  <!-- ================= RESULTS ================= -->

  <h2>Student Results</h2>
  <button class="btn dashboard-btn" onclick="loadResults()">Load Results</button>

  <div id="resultsBox"></div>

</div>

<script type="module">

import { db, auth } from './firebase-config.js';

import {
  addDoc,
  collection,
  getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


// ================= AUTH CHECK =================
auth.onAuthStateChanged((user) => {
  if (!user) {
    alert("Login required!");
    window.location.href = "index.html";
  }
});


// ================= CREATE TEST =================
window.createTest = async function () {

  try {

    let className = document.getElementById("className").value;
    let title = document.getElementById("title").value.trim();
    let jsonText = document.getElementById("jsonInput").value.trim();

    if (!className) throw new Error("Select class");
    if (!title) throw new Error("Enter title");
    if (!jsonText) throw new Error("Enter questions");

    let questions = JSON.parse(jsonText);

    await addDoc(collection(db, "tests"), {
      className,
      title,
      questions,
      createdAt: new Date().toISOString()
    });

    document.getElementById("msg").style.color = "green";
    document.getElementById("msg").innerText = "Test Created Successfully!";

    document.getElementById("title").value = "";
    document.getElementById("jsonInput").value = "";
    document.getElementById("className").value = "";

  } catch (e) {
    document.getElementById("msg").style.color = "red";
    document.getElementById("msg").innerText = e.message;
  }
};


// ================= LOAD RESULTS =================
window.loadResults = async function () {

  let box = document.getElementById("resultsBox");
  box.innerHTML = "Loading...";

  const snap = await getDocs(collection(db, "results"));

  box.innerHTML = "";

  if (snap.empty) {
    box.innerHTML = "No results found";
    return;
  }

  snap.forEach(doc => {

    let r = doc.data();

    box.innerHTML += `
      <div class="card">

        <b>Student:</b> ${r.studentName}<br>
        <b>Class:</b> ${r.studentClass}<br>
        <b>Email:</b> ${r.userEmail}<br>
        <b>Test:</b> ${r.testTitle}<br>
        <b>Score:</b> ${r.score} / ${r.total}<br>
        <b>Date:</b> ${r.createdAt}

      </div>
    `;
  });
};


// ================= DASHBOARD =================
window.goDashboard = function () {
  window.location.href = "dashboard.html";
};

</script>

</body>
</html>
