<!DOCTYPE html>
<html>
<head>
  <title>Admin Panel</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body{
      font-family:Arial;
      background:#eef2f7;
      margin:0;
    }

    #loginScreen{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
    }

    .login-box{
      background:white;
      padding:25px;
      border-radius:12px;
      width:300px;
      text-align:center;
    }

    .login-box input{
      width:100%;
      padding:10px;
      margin-top:10px;
    }

    .login-box button{
      margin-top:10px;
      width:100%;
      padding:10px;
      background:#007bff;
      color:white;
      border:none;
      cursor:pointer;
    }

    .container{
      display:none;
      max-width:1100px;
      margin:auto;
      background:white;
      padding:20px;
      border-radius:12px;
      margin-top:20px;
    }

    select{
      width:100%;
      padding:10px;
      margin:10px 0;
    }

    button{
      padding:10px;
      margin:5px;
      border:none;
      cursor:pointer;
      border-radius:6px;
    }

    .card{
      background:#f9f9f9;
      padding:10px;
      margin:10px 0;
      border-radius:8px;
    }

    .grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:20px;
    }

    canvas{
      max-height:300px;
    }
  </style>
</head>

<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-box">
    <h3>Admin Login</h3>
    <input type="password" id="pass">
    <button onclick="login()">Login</button>
    <p id="err" style="color:red"></p>
  </div>
</div>

<!-- DASHBOARD -->
<div class="container">

  <h2>Admin Dashboard</h2>

  <select id="classFilter" onchange="loadResults()">
    <option value="">All Classes</option>
    <option value="10">Class 10</option>
    <option value="11">Class 11</option>
    <option value="12">Class 12</option>
    <option value="IIT-JEE">IIT-JEE</option>
    <option value="NEET">NEET</option>
  </select>

  <button onclick="loadResults()">Load Results</button>

  <div class="grid">
    <canvas id="pie"></canvas>
    <canvas id="bar"></canvas>
  </div>

  <h3>Class-wise Summary</h3>
  <div id="classSummary"></div>

  <h3>Student Ranking</h3>
  <div id="ranking"></div>

  <h3>All Results</h3>
  <div id="results"></div>

</div>

<script type="module">
import { db } from './firebase-config.js';
import { collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

window.login = function(){
  let p = document.getElementById("pass").value;
  if(p === "7812"){
    document.getElementById("loginScreen").style.display="none";
    document.querySelector(".container").style.display="block";
    loadResults();
  } else {
    document.getElementById("err").innerText="Wrong password";
  }
};

window.loadResults = async function(){

  let snap = await getDocs(collection(db,"results"));

  let all = [];
  let classFilter = document.getElementById("classFilter").value;

  snap.forEach(d=>{
    let r = d.data();

    if(classFilter && String(r.studentClass) !== String(classFilter)) return;

    all.push(r);
  });

  if(all.length === 0){
    document.getElementById("results").innerHTML="No data";
    document.getElementById("ranking").innerHTML="";
    document.getElementById("classSummary").innerHTML="";
    return;
  }

  // ================= CLASS GROUP =================
  let classes = {
    "10": [],
    "11": [],
    "12": [],
    "IIT-JEE": [],
    "NEET": []
  };

  all.forEach(r=>{
    if(classes[r.studentClass]){
      classes[r.studentClass].push(r);
    }
  });

  // ================= CLASS SUMMARY =================
  let classHTML = "";

  for(let cls in classes){

    let list = classes[cls];

    if(list.length === 0) continue;

    let avg = list.reduce((a,b)=>a+b.score,0)/list.length;
    let topper = list.sort((a,b)=>b.score-a.score)[0];

    classHTML += `
      <div class="card">
        <h3>${cls}</h3>
        Students: ${list.length}<br>
        Avg Score: ${avg.toFixed(2)}<br>
        🏆 Topper: ${topper.studentName} (${topper.score}/${topper.total})
      </div>
    `;
  }

  document.getElementById("classSummary").innerHTML = classHTML;

  // ================= RANKING =================
  all.sort((a,b)=>b.score-a.score);

  let rankHTML = "";

  all.forEach((r,i)=>{
    rankHTML += `
      <div class="card">
        🥇 Rank ${i+1}<br>
        <b>${r.studentName}</b> (${r.studentClass})<br>
        Score: ${r.score}/${r.total}
      </div>
    `;
  });

  document.getElementById("ranking").innerHTML = rankHTML;

  // ================= PIE =================
  let pass = all.filter(r=>r.score>=5).length;
  let fail = all.length-pass;

  new Chart(document.getElementById("pie"),{
    type:"pie",
    data:{
      labels:["Pass","Fail"],
      datasets:[{data:[pass,fail]}]
    }
  });

  // ================= BAR =================
  new Chart(document.getElementById("bar"),{
    type:"bar",
    data:{
      labels:all.map(r=>r.studentName),
      datasets:[{
        label:"Score",
        data:all.map(r=>r.score)
      }]
    }
  });

  // ================= LIST =================
  let html = "";

  all.forEach(r=>{
    html += `
      <div class="card">
        <b>${r.studentName}</b> (${r.studentClass})<br>
        Score: ${r.score}/${r.total}<br>
        <button onclick='view(${JSON.stringify(JSON.stringify(r))})'>
          View
        </button>
      </div>
    `;
  });

  document.getElementById("results").innerHTML = html;
};

window.view = function(data){
  let r = JSON.parse(data);

  let review = r.review.map((q,i)=>`
    <div class="card">
      Q${i+1}: ${q.question}<br>
      Your: ${q.studentAnswer}<br>
      Correct: ${q.correctAnswer}
    </div>
  `).join("");

  document.body.innerHTML += `
    <div style="position:fixed;top:0;left:0;width:100%;height:100%;background:white;overflow:auto;padding:20px">
      <h2>${r.studentName}</h2>
      ${review}
      <button onclick="location.reload()">Close</button>
    </div>
  `;
};
</script>

</body>
</html>
