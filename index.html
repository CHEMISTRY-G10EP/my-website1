<!DOCTYPE html>
<html>
<head>
  <title>Student Login</title>

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>

    *{
      box-sizing:border-box;
    }

    body{

      margin:0;
      font-family:Arial, sans-serif;

      height:100vh;

      display:flex;
      justify-content:center;
      align-items:center;

      background:linear-gradient(
        135deg,
        #4facfe,
        #00f2fe
      );
    }

    .login-box{

      width:100%;
      max-width:380px;

      background:white;

      padding:35px;

      border-radius:18px;

      box-shadow:0 10px 25px rgba(0,0,0,0.2);

      animation:fadeIn 0.6s ease;
    }

    @keyframes fadeIn{

      from{
        opacity:0;
        transform:translateY(20px);
      }

      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    .logo{

      text-align:center;
      font-size:45px;
      margin-bottom:10px;
    }

    h2{

      text-align:center;
      margin-bottom:5px;
      color:#333;
    }

    .subtitle{

      text-align:center;
      color:#666;
      margin-bottom:25px;
      font-size:14px;
    }

    input{

      width:100%;

      padding:12px;

      margin-bottom:15px;

      border:1px solid #ccc;

      border-radius:8px;

      font-size:15px;
    }

    input:focus{

      border-color:#007bff;
      outline:none;
      box-shadow:0 0 5px rgba(0,123,255,0.3);
    }

    .btn{

      width:100%;

      padding:12px;

      border:none;

      border-radius:8px;

      font-size:16px;

      font-weight:bold;

      cursor:pointer;

      transition:0.3s;

      margin-top:8px;
    }

    .login-btn{

      background:#007bff;
      color:white;
    }

    .login-btn:hover{

      background:#0056b3;
      transform:scale(1.02);
    }

    .admin-btn{

      background:#28a745;
      color:white;
    }

    .admin-btn:hover{

      background:#1e7e34;
      transform:scale(1.02);
    }

    #msg{

      margin-top:18px;

      text-align:center;

      font-weight:bold;

      min-height:20px;
    }

    .footer{

      text-align:center;

      margin-top:20px;

      font-size:13px;

      color:#666;
    }

  </style>
</head>
<body>

<div class="login-box">

  <div class="logo">
    🎓
  </div>

  <h2>Student Portal</h2>

  <div class="subtitle">
    Login to access your tests and results
  </div>

  <input
    type="email"
    id="email"
    placeholder="Enter Email"
  >

  <input
    type="password"
    id="password"
    placeholder="Enter Password"
  >

  <button
    class="btn login-btn"
    onclick="login()"
  >
    Login
  </button>

  <button
    class="btn admin-btn"
    onclick="goAdmin()"
  >
    Admin Panel
  </button>

  <p id="msg"></p>

  <div class="footer">
    Powered by G10 Educational Platform
  </div>

</div>

<script type="module">

import { auth } from './firebase-config.js';

import {

  signInWithEmailAndPassword,
  onAuthStateChanged

} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

onAuthStateChanged(auth, (user)=>{

  if(user){

    window.location.href =
      "dashboard.html";
  }
});

window.login = async function () {

  let email =
    document.getElementById("email")
    .value.trim();

  let password =
    document.getElementById("password")
    .value.trim();

  let msg =
    document.getElementById("msg");

  msg.style.color = "red";

  if(!email || !password){

    msg.innerText =
      "Please enter email and password";

    return;
  }

  try {

    msg.style.color = "#007bff";

    msg.innerText =
      "Logging in...";

    await signInWithEmailAndPassword(

      auth,
      email,
      password
    );

    msg.style.color = "green";

    msg.innerText =
      "Login Successful";

    window.location.href =
      "dashboard.html";
  }
  catch (e) {

    msg.style.color = "red";

    if(
      e.code ===
      "auth/invalid-credential"
    ){

      msg.innerText =
        "Invalid email or password";
    }
    else{

      msg.innerText =
        e.message;
    }
  }
};

window.goAdmin = function(){

  window.location.href =
    "admin.html";
};

document.addEventListener(

  "keypress",

  function(e){

    if(e.key === "Enter"){

      login();
    }
  }
);

</script>

</body>
</html>
