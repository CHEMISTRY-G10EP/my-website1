<!DOCTYPE html>
<html>
<head>
  <title>Advanced Result</title>

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>

    *{box-sizing:border-box;}

    body{
      font-family:Arial;
      margin:0;
      background:#eef2f7;
      padding:20px;
    }

    .container{
      max-width:1100px;
      margin:auto;
    }

    /* ================= TOP SUMMARY ================= */
    .card{
      background:white;
      padding:20px;
      border-radius:12px;
      margin-bottom:15px;
      box-shadow:0 0 10px rgba(0,0,0,0.1);
    }

    /* ================= QUESTION ================= */
    .q-box{
      background:white;
      padding:20px;
      margin:15px 0;
      border-radius:12px;
      box-shadow:0 0 8px rgba(0,0,0,0.08);
      scroll-margin-top:100px;
      position:relative;
    }

    .correct{color:green;font-weight:bold;}
    .wrong{color:red;font-weight:bold;}

    /* ================= FLOAT NAV ================= */
    .nav{
      position:fixed;
      right:10px;
      top:80px;
      width:70px;
      max-height:70vh;
      overflow:auto;
      background:white;
      border-radius:12px;
      box-shadow:0 0 10px rgba(0,0,0,0.2);
      padding:10px;
    }

    .nav-item{
      width:40px;
      height:40px;
      margin:5px auto;
      display:flex;
      align-items:center;
      justify-content:center;
      border-radius:8px;
      font-weight:bold;
      cursor:pointer;
      color:white;
      transition:0.2s;
    }

    .nav-item:hover{
      transform:scale(1.1);
    }

    .correct-b{background:#28a745;}
    .wrong-b{background:#dc3545;}

    .active{
      outline:3px solid #000;
    }

    /* ================= BOOKMARK ================= */
    .bookmark{
      position:absolute;
      top:10px;
      right:10px;
      cursor:pointer;
      font-size:20px;
    }

    .bookmarked{
      color:gold;
    }

    /* ================= BUTTONS ================= */
    .btn{
      padding:10px 15px;
      border:none;
      border-radius:8px;
      cursor:pointer;
      font-weight:bold;
      margin:5px;
      color:white;
    }

    .blue{background:#007bff;}
    .green{background:#28a745;}

  </style>
</head>

<body>

<div class="container">

  <div id="summary"></div>

  <h3>Question Analysis</h3>
  <div id="questions"></div>

</div>

<!-- FLOAT NAV -->
<div class="nav" id="nav"></div>

<script>

let result = JSON.parse(localStorage.getItem("latestResult"));

if(!result){
  document.body.innerHTML = "<h2>No Result Found</h2>";
}

/* ================= AI ANALYSIS ================= */
function aiAnalysis(){
  let p = (result.score/result.total)*100;

  if(p >= 80) return "Excellent performance 🚀 Keep practicing to maintain rank.";
  if(p >= 60) return "Good performance 👍 Improve accuracy for better score.";
  if(p >= 40) return "Average performance ⚠ Focus on weak topics.";
  return "Poor performance ❌ Need strong revision of basics.";
}

/* ================= SUMMARY ================= */
document.getElementById("summary").innerHTML = `
  <div class="card">
    <h2>${result.testTitle}</h2>
    <p><b>Student:</b> ${result.studentName}</p>
    <p><b>Score:</b> ${result.score}/${result.total}</p>
    <p><b>AI Analysis:</b> ${aiAnalysis()}</p>

    <button class="btn blue" onclick="startTimer()">Start Review Timer</button>
    <button class="btn green" onclick="stopTimer()">Stop Timer</button>
    <p id="timeSpent">Time: 0 sec</p>
  </div>
`;

let startTime;
let timer;

/* ================= TIMER ================= */
function startTimer(){
  startTime = Date.now();
  timer = setInterval(()=>{
    let sec = Math.floor((Date.now()-startTime)/1000);
    document.getElementById("timeSpent").innerText = "Time: "+sec+" sec";
  },1000);
}

function stopTimer(){
  clearInterval(timer);
}

/* ================= QUESTIONS ================= */
let qHTML = "";
let navHTML = "";

result.review.forEach((q,i)=>{

  let correct = q.studentAnswer === q.correctAnswer;

  qHTML += `
    <div class="q-box" id="q${i}">
      <div class="bookmark" onclick="bookmark(${i}, this)">⭐</div>

      <h3>Q${i+1}. ${q.question}</h3>

      <p class="${correct?'correct':'wrong'}">
        Your Answer: ${q.studentAnswer}
      </p>

      <p><b>Correct:</b> ${q.correctAnswer}</p>
    </div>
  `;

  navHTML += `
    <div class="nav-item ${correct?'correct-b':'wrong-b'}"
         onclick="goto(${i})">
      ${i+1}
    </div>
  `;
});

document.getElementById("questions").innerHTML = qHTML;
document.getElementById("nav").innerHTML = navHTML;

/* ================= NAVIGATION ================= */
function goto(i){
  document.getElementById("q"+i)
  .scrollIntoView({behavior:"smooth", block:"center"});
}

/* ================= BOOKMARK ================= */
function bookmark(i, el){
  el.classList.toggle("bookmarked");
}

/* ================= HIGHLIGHT SCROLL ================= */
window.addEventListener("scroll",()=>{

  document.querySelectorAll(".q-box").forEach((box,i)=>{

    let rect = box.getBoundingClientRect();

    let nav = document.querySelectorAll(".nav-item")[i];

    if(rect.top < 200 && rect.bottom > 200){
      nav.classList.add("active");
    }else{
      nav.classList.remove("active");
    }

  });

});

</script>

</body>
</html>
